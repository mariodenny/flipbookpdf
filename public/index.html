<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Upload a PDF and turn it into a beautiful animated flipbook.">
  <title>PDF Flipbook — Upload</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <h1>📖 PDF Flipbook</h1>
      <p>Turn your PDF into a book</p>
    </header>

    <main class="card">
      <div id="alert" class="alert" role="alert"></div>

      <form id="upload-form" enctype="multipart/form-data">
        <div class="form-group">
          <label for="title">Book Title</label>
          <input
            type="text"
            id="title"
            name="title"
            class="form-control"
            placeholder="e.g. Pengantar Kebugaran Jasmani"
            maxlength="200"
            required
          >
        </div>

        <div class="form-group">
          <label for="file">Document File</label>
          <div class="file-input-wrapper">
            <input
              type="file"
              id="file"
              name="file"
              accept=".pdf,.doc,.docx,.txt,.md,.rtf,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,application/rtf,text/rtf"
              required
            >
          </div>
          <small class="form-hint" style="display:block; margin-top:0.4rem; color:var(--text-muted, #94a3b8); font-size:0.82rem;">
            Supported: PDF, DOC, DOCX, TXT, MD, RTF
          </small>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary">
          Generate Flipbook
        </button>
      </form>
    </main>

    <p style="text-align:center; margin-top:1.5rem;">
      <a href="/books">View All Books →</a>
    </p>
  </div>

  <script src="/js/upload.js"></script>
</body>
</html>
