<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage uploaded PDF flipbooks.">
  <title>Books — PDF Flipbook</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="brand">
      <h1>📖 PDF Flipbook</h1>
    </header>

    <main class="card">
      <div class="books-header">
        <h2>Books</h2>
        <a href="/" class="btn btn-primary btn-sm">+ Upload New Book</a>
      </div>

      <div id="alert" class="alert" role="alert"></div>

      <div id="books-container">
        <div class="viewer-loading">
          <div class="spinner-lg"></div>
          <p>Loading books…</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/books.js"></script>
</body>
</html>
